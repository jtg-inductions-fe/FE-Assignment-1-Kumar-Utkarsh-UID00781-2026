<!doctype html>
<html lang="en">
    <head>
        <title>Title</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="src/styles/main.scss" />
    </head>
    <body>
        <header class="header container">
            <a href="#main-content" class="header__skip-link"
                >Skip to main content</a
            >
            <img
                class="header__logo"
                src="/assets/images/company-logo.png"
                alt="Travlog logo"
            />
            <nav class="header__nav" aria-label="Primary">
                <ul class="header__nav__links">
                    <!-- Rendered from JSON -->
                </ul>
            </nav>
            <div class="header__actions">
                <button type="button" class="btn btn--secondary">Login</button>
                <button type="button" class="btn btn--primary">Sign up</button>
            </div>
            <button
                type="button"
                class="header__toggle-btn"
                aria-label="Open primary navigation"
                aria-expanded="false"
                aria-controls="primary-nav-menu"
            >
                <div class="header__toggle-btn__line" id="line-1"></div>
                <div class="header__toggle-btn__line" id="line-2"></div>
                <div class="header__toggle-btn__line" id="line-3"></div>
            </button>
            <div id="primary-nav-menu" class="header__menu" inert>
                <nav class="header__menu__nav" aria-label="Primary">
                    <ul class="header__menu__links">
                        <!-- Rendered from JSON -->
                    </ul>
                </nav>
                <div class="header__menu__actions">
                    <button type="button" class="btn btn--secondary">
                        Login
                    </button>
                    <button type="button" class="btn btn--primary">
                        Sign up
                    </button>
                </div>
            </div>
        </header>
        <main id="main-content"></main>
        <script type="module" src="./src/script/renderFromJSON.js"></script>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
